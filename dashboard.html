<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SME Security Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>

:root{
  --bg:#080c14;--surface:#0e1420;--surface2:#141c2e;--surface3:#1a2438;
  --border:#1e2d47;--border2:#253552;
  --text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;
  --blue:#3b82f6;--blue-dim:#1e3a6e;
  --green:#10b981;--green-dim:#064e3b;
  --red:#ef4444;--red-dim:#450a0a;
  --amber:#f59e0b;--amber-dim:#451a03;
  --purple:#a855f7;--purple-dim:#2e1065;
  --cyan:#06b6d4;--sidebar-w:220px;--radius:10px;--shadow:0 4px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow:hidden;}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:50;}
.sidebar-brand{padding:20px 16px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.brand-icon{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.brand-text{font-weight:700;font-size:14px;line-height:1.2;}
.brand-sub{font-size:10px;color:var(--muted);}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px;}
.nav-section-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 8px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .15s;color:var(--muted2);font-size:13px;user-select:none;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--blue-dim);color:var(--blue);font-weight:500;}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;}
.sidebar-footer{padding:12px 8px;border-top:1px solid var(--border);}
.user-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface2);}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.user-info{flex:1;min-width:0;}
.user-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:10px;color:var(--muted);text-transform:capitalize;}
.main{margin-left:var(--sidebar-w);flex:1;overflow-y:auto;height:100vh;}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:40;}
.page-title{font-size:15px;font-weight:600;flex:1;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
.conn-dot.off{background:var(--red);box-shadow:0 0 6px var(--red);}
.content{padding:20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.card-title{font-size:13px;font-weight:600;color:var(--muted2);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-card.blue::after{background:linear-gradient(90deg,var(--blue),var(--cyan));}
.stat-card.green::after{background:linear-gradient(90deg,var(--green),#34d399);}
.stat-card.red::after{background:linear-gradient(90deg,var(--red),#f97316);}
.stat-card.amber::after{background:linear-gradient(90deg,var(--amber),#fcd34d);}
.stat-card.purple::after{background:linear-gradient(90deg,var(--purple),#ec4899);}
.stat-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:var(--shadow);}
.stat-num{font-size:32px;font-weight:800;line-height:1;margin-bottom:4px;letter-spacing:-1px;}
.stat-label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;}
.stat-sub{font-size:11px;color:var(--muted);margin-top:6px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:8px 12px;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap;}
th.rz{position:relative;overflow:hidden;text-overflow:ellipsis;}
.col-rz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:2;user-select:none;}
.col-rz:hover,.col-rz.active{background:rgba(59,130,246,.35);}
tr.cr-row{cursor:pointer;}
tr.cr-row:hover td{background:var(--surface2);}
td{padding:8px 12px;border-bottom:1px solid rgba(30,45,71,.5);vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,.015);}
tr.cr{cursor:pointer;}
.badge{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:inline-block;}
.b-red{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25);}
.b-amber{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.25);}
.b-green{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.25);}
.b-blue{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25);}
.b-purple{background:rgba(168,85,247,.12);color:#c084fc;border:1px solid rgba(168,85,247,.25);}
.b-muted{background:rgba(100,116,139,.12);color:var(--muted2);border:1px solid rgba(100,116,139,.25);}
.btn{font-size:12px;padding:6px 12px;border-radius:7px;cursor:pointer;border:1px solid;transition:all .15s;font-family:inherit;font-weight:500;display:inline-flex;align-items:center;gap:5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-p:hover:not(:disabled){background:#2563eb;}
.btn-d{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red);}
.btn-d:hover:not(:disabled){background:rgba(239,68,68,.25);}
.btn-g{background:transparent;border-color:var(--border2);color:var(--muted2);}
.btn-g:hover:not(:disabled){background:var(--surface2);color:var(--text);}
.btn-s{background:rgba(16,185,129,.1);border-color:var(--green);color:var(--green);}
.btn-s:hover:not(:disabled){background:rgba(16,185,129,.25);}
.btn-pu{background:rgba(168,85,247,.1);border-color:var(--purple);color:var(--purple);}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;}
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.fi,.fs{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:12px;font-family:inherit;outline:none;}
.fi:focus,.fs:focus{border-color:var(--blue);}
.fi::placeholder{color:var(--muted);}
.bulk-bar{background:var(--blue-dim);border:1px solid var(--blue);border-radius:8px;padding:8px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;}
.perf-bar{background:var(--surface2);height:5px;border-radius:3px;overflow:hidden;margin-top:6px;}
.perf-fill{height:100%;border-radius:3px;transition:width .6s ease,background .3s;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;box-shadow:var(--shadow);}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-title{font-weight:700;font-size:15px;}
.modal-x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:5px;}
.modal-x:hover{background:var(--surface2);color:var(--text);}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.stab{background:none;border:none;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:12px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;font-family:inherit;}
.stab:hover{color:var(--text);}
.stab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500;}
.spanel{display:none;}
.spanel.active{display:block;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ff{display:flex;flex-direction:column;gap:5px;}
.ff.full{grid-column:1/-1;}
.fl{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;}
.fip{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:7px;font-size:13px;font-family:inherit;outline:none;width:100%;}
.fip:focus{border-color:var(--blue);}
.fip::placeholder{color:var(--muted);}
.fsel{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:7px;font-size:13px;font-family:inherit;outline:none;width:100%;}
.fsel:focus{border-color:var(--blue);}
.ai-panel{background:linear-gradient(135deg,rgba(59,130,246,.05),rgba(168,85,247,.05));border:1px solid rgba(168,85,247,.2);border-radius:10px;padding:14px;margin-top:14px;}
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:360px;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.login-brand{text-align:center;margin-bottom:28px;}
.login-icon{width:56px;height:56px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;}
.lerr{background:var(--red-dim);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:#f87171;margin-bottom:12px;display:none;}
.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;}
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.prop{background:var(--surface2);border-radius:8px;padding:12px;}
.pl{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.pv{font-size:13px;font-weight:500;}
.empty{text-align:center;padding:48px;color:var(--muted);font-size:13px;}
.scroll{max-height:350px;overflow-y:auto;}
.sec-title{font-size:12px;font-weight:700;color:var(--muted2);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}
.iac{display:flex;gap:5px;opacity:0;transition:opacity .15s;}
tr:hover .iac{opacity:1;}
.mod-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.md-ok{background:var(--green);}
.md-fail{background:var(--red);}
.md-unk{background:var(--muted);}
.tl-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(30,45,71,.5);}
.tl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.tl-cnt{flex:1;min-width:0;}
.tl-t{font-size:10px;color:var(--muted);}
.tl-e{font-size:12px;margin:2px 0;}
.tl-d{font-size:10px;color:var(--muted);font-family:monospace;word-break:break-all;}

</style>
</head>
<body>

<div class="login-screen" id="ls">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-icon">&#x1F6E1;</div>
      <div style="font-size:20px;font-weight:800;margin-bottom:4px">SME Security</div>
      <div style="font-size:13px;color:var(--muted)">Sign in to your security console</div>
    </div>
    <div class="lerr" id="lerr"></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="ff"><div class="fl">Username</div><input id="lu" class="fip" placeholder="admin" autocomplete="username"></div>
      <div class="ff"><div class="fl">Password</div><input id="lp" class="fip" type="password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" autocomplete="current-password"></div>
      <button class="btn btn-p" style="width:100%;padding:10px;font-size:14px" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">&#x1F6E1;</div>
    <div><div class="brand-text" id="org-name">SME Security</div><div class="brand-sub">Operations Console</div></div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section-label">Monitoring</div>
    <button class="nav-item active" data-page="overview"   onclick="goTo('overview')"><span class="icon">&#x1F4CA;</span>Overview</button>
    <button class="nav-item"        data-page="status"     onclick="goTo('status')"><span class="icon">&#x1F5A5;</span>Live Status</button>
    <button class="nav-item"        data-page="inventory"  onclick="goTo('inventory')"><span class="icon">&#x1F4CB;</span>Inventory</button>
    <button class="nav-item"        data-page="alerts"     onclick="goTo('alerts')"><span class="icon">&#x1F6A8;</span>Alerts<span class="nav-badge" id="ab" style="display:none">0</span></button>
    <div class="nav-section-label" style="margin-top:8px">Management</div>
    <button class="nav-item" data-page="apps"        onclick="goTo('apps')"><span class="icon">&#x1F4E6;</span>App Inventory</button>
    <button class="nav-item" data-page="enforcement" onclick="goTo('enforcement')"><span class="icon">&#x1F512;</span>Enforcement</button>
    <button class="nav-item" data-page="rules"       onclick="goTo('rules')"><span class="icon">&#x1F4D0;</span>Detection Rules</button>
    <div id="admin-nav" style="display:none">
      <div class="nav-section-label" style="margin-top:8px">Admin</div>
      <button class="nav-item" data-page="users"    onclick="goTo('users')"><span class="icon">&#x1F465;</span>Users</button>
      <button class="nav-item" data-page="settings" onclick="goTo('settings')"><span class="icon">&#x2699;</span>Settings</button>
    </div>
    <div id="analyst-nav" style="display:none">
      <div class="nav-section-label" style="margin-top:8px">Account</div>
      <button class="nav-item" data-page="settings" onclick="goTo('settings')"><span class="icon">&#x2699;</span>Settings</button>
    </div>
  </div>
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="user-avatar" id="uav">?</div>
      <div class="user-info"><div class="user-name" id="uname">...</div><div class="user-role" id="urole">...</div></div>
      <button class="btn btn-g" style="padding:4px 8px;font-size:11px" onclick="doLogout()">Out</button>
    </div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:8px;padding:0 4px">
      <div class="conn-dot" id="cdot"></div>
      <span id="ctxt">Connecting...</span>
      <span style="margin-left:auto;font-size:10px" id="ctime"></span>
    </div>
  </div>
</nav>

<div class="main" id="main" style="display:none">
  <div class="topbar">
    <div class="page-title" id="ptitle">Overview</div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-g" style="font-size:11px" onclick="refreshAll()">&#x21BB; Refresh</button>
    </div>
  </div>
  <div class="content" id="content">Loading...</div>
</div>

<!-- Modals -->
<div id="dm" class="modal-overlay" style="display:none" onclick="cmo(event,'dm')">
  <div class="modal" style="max-width:900px" onclick="event.stopPropagation()">
    <div class="modal-hdr"><span class="modal-title" id="dm-t">Device</span><button class="modal-x" onclick="cM('dm')">&#x2715;</button></div>
    <div class="modal-body" id="dm-b"></div>
  </div>
</div>
<div id="am" class="modal-overlay" style="display:none" onclick="cmo(event,'am')">
  <div class="modal" style="max-width:680px" onclick="event.stopPropagation()">
    <div class="modal-hdr"><span class="modal-title" id="am-t">Alert</span><button class="modal-x" onclick="cM('am')">&#x2715;</button></div>
    <div class="modal-body" id="am-b"></div>
  </div>
</div>
<div id="um" class="modal-overlay" style="display:none" onclick="cmo(event,'um')">
  <div class="modal" style="max-width:440px" onclick="event.stopPropagation()">
    <div class="modal-hdr"><span class="modal-title" id="um-t">User</span><button class="modal-x" onclick="cM('um')">&#x2715;</button></div>
    <div class="modal-body" id="um-b"></div>
    <div class="modal-foot"><button class="btn btn-g" onclick="cM('um')">Cancel</button><button class="btn btn-p" onclick="saveUser()">Save</button></div>
  </div>
</div>
<div id="rm" class="modal-overlay" style="display:none" onclick="cmo(event,'rm')">
  <div class="modal" style="max-width:700px" onclick="event.stopPropagation()">
    <div class="modal-hdr"><span class="modal-title" id="rm-t">Rule</span><button class="modal-x" onclick="cM('rm')">&#x2715;</button></div>
    <div class="modal-body" id="rm-b"></div>
    <div class="modal-foot"><button class="btn btn-g" onclick="cM('rm')">Cancel</button><button class="btn btn-p" onclick="saveRule()">Save Rule</button></div>
  </div>
</div>
<div id="em" class="modal-overlay" style="display:none" onclick="cmo(event,'em')">
  <div class="modal" style="max-width:700px" onclick="event.stopPropagation()">
    <div class="modal-hdr"><span class="modal-title" id="em-t">Timeline Event</span><button class="modal-x" onclick="cM('em')">&#x2715;</button></div>
    <div class="modal-body" id="em-b"></div>
  </div>
</div>

<script>

let _tok=null,_user=null,_M=[],_D=[],_A=[],_R=[];
let _selA=new Set(),_editR=null,_editU=null,_page='overview';
let _charts={};
const PTITLES={overview:'Overview',status:'Live Status',inventory:'Inventory',alerts:'Alerts',apps:'App Inventory',enforcement:'Enforcement',rules:'Detection Rules',users:'User Management',settings:'Settings'};

function pTS(s){if(!s)return null;const hasTz=/Z$|[+-]\d{2}:\d{2}$/.test(s);const d=new Date(hasTz?s:s+'Z');return isNaN(d)?null:d;}
function fmtTS(s){const d=pTS(s);return d?d.toLocaleString():'-';}
function fmtAge(s){const d=pTS(s);if(!d)return '-';const sc=Math.floor((Date.now()-d)/1000);if(sc<60)return sc+'s ago';if(sc<3600)return Math.floor(sc/60)+'m ago';if(sc<86400)return Math.floor(sc/3600)+'h ago';return Math.floor(sc/86400)+'d ago';}
function fmtBytes(n){n=Number(n)||0;if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++;}while(n>=1024&&i<u.length-1);return n.toFixed(1)+' '+u[i];}
function fmtMin(m){if(m===null||m===undefined)return 'N/A';if(m<60)return m.toFixed(0)+'m';return (m/60).toFixed(1)+'h';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function eA(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function sC(v){const s=(v||'').toUpperCase();return s==='CRITICAL'||s==='SEVERE'?'b-red':s==='HIGH'?'b-amber':s==='MEDIUM'?'b-blue':'b-muted';}
function stC(s){return s==='New'?'b-red':s==='Open'?'b-amber':'b-muted';}
function sI(s){return{defender:'&#x1F6E1;',playbook:'&#x1F4CB;',playbook_via_defender:'&#x1F517;'}[s]||'&#x2753;';}
function rC(r){return r==='critical'||r==='high'?'b-red':r==='medium'?'b-blue':'b-muted';}

async function api(p,o={}){
  const h={'Content-Type':'application/json',...(o.headers||{})};
  if(_tok)h['Authorization']='Bearer '+_tok;
  const r=await fetch(p,{...o,headers:h});
  if(r.status===401){doLogout();throw new Error('Session expired');}
  return r;
}

async function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value;
  const e=document.getElementById('lerr');
  e.style.display='none';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    if(!r.ok){const d=await r.json().catch(()=>({detail:'Login failed'}));e.textContent=d.detail||'Invalid credentials';e.style.display='block';return;}
    const d=await r.json();

function initApp(){

function goTo(pg){
  _page=pg;

async function refreshAll(){
  try{
    const[sm,dm,am]=await Promise.all([
      api('/api/status').then(r=>r.ok?r.json():null),
      api('/api/inventory').then(r=>r.ok?r.json():null),
      api('/api/alerts').then(r=>r.ok?r.json():null),
    ]);
    if(sm)_M=sm.machines||[];
    if(dm)_D=dm.devices||[];
    if(am)_A=am.alerts||[];
    const nc=_A.filter(a=>a.status==='New').length;
    const ab=document.getElementById('ab');
    if(nc>0){ab.textContent=nc;ab.style.display='inline';}else ab.style.display='none';
    document.getElementById('cdot').className='conn-dot';
    document.getElementById('ctxt').textContent=_M.length+' machine(s)';
    document.getElementById('ctime').textContent='Updated '+new Date().toLocaleTimeString();
    renderPage();
  }catch(ex){document.getElementById('cdot').className='conn-dot off';document.getElementById('ctxt').textContent='Connection error';}
}

function renderPage(){
  const el=document.getElementById('content');
  if(_page==='overview')renderOverview(el);
  else if(_page==='status')renderStatus(el);
  else if(_page==='inventory')renderInventory(el);
  else if(_page==='alerts')renderAlerts(el);
  else if(_page==='apps')renderApps(el);
  else if(_page==='enforcement')renderEnforcement(el);
  else if(_page==='rules')renderRules(el);
  else if(_page==='users')renderUsers(el);
  else if(_page==='settings')renderSettings(el);
  else el.innerHTML='<div class="empty">Page not found</div>';
}

async function cmd(site,host,command,btn){
  btn.disabled=true;const st=btn.closest('.card').querySelector('.cmd-st');
  if(st)st.textContent='Sending...';
  try{const r=await api('/api/command',{method:'POST',body:JSON.stringify({site_name:site,hostname:host,command})});

// ── Device Timeline tab: table view with type/content/date-range filters,
// resizable columns, clickable rows (full detail modal) + CSV export ──
let _TL=[],_TLdev={site:'',hostname:''},_tlF='',_tlType='',_tlStart='',_tlEnd='';
const TL_ICON={process_creation:'&#x2699;',logon:'&#x1F511;',logon_failure:'&#x26A0;',logoff:'&#x1F6AA;',service_installed:'&#x1F6E0;',service_crash:'&#x1F4A5;',threat_detected:'&#x1F6A8;',rule_match:'&#x1F4CB;',usb_execution:'&#x1F4BE;',suspicious_process:'&#x1F534;',network_connection:'&#x1F310;',defender:'&#x1F6E1;'};
const TL_COLOR={process_creation:'var(--blue)',logon:'var(--green)',logon_failure:'var(--red)',logoff:'var(--muted)',service_installed:'var(--amber)',service_crash:'var(--red)',threat_detected:'var(--red)',rule_match:'var(--amber)',usb_execution:'var(--amber)',suspicious_process:'var(--red)',network_connection:'var(--cyan)',defender:'var(--blue)'};
const TL_SEARCH_FIELDS=['threat_name','process_name','command_line','path','user','parent_name','source_ip','remote_address','event_type'];
const TL_CSV_COLS=['time','event_type','process_name','pid','parent_name','user','command_line','path','logon_type','source_ip','remote_address','remote_port','threat_name','severity','action'];
// Column widths (px) — user-adjustable via drag handles, kept for the
// rest of the session so re-filtering doesn't reset them.
const TL_COLS=[{key:'time',label:'Time',w:130},{key:'type',label:'Type',w:150},{key:'desc',label:'Description',w:190},{key:'pid',label:'PID',w:75},{key:'user',label:'User',w:170},{key:'detail',label:'Detail',w:300},{key:'sev',label:'Severity/Action',w:120}];
let _tlColW=null;

function tlFiltered(){
  let rows=_TL.slice();
  if(_tlType)rows=rows.filter(e=>(e.event_type||e.source||'event')===_tlType);
  if(_tlF){const q=_tlF.toLowerCase();rows=rows.filter(e=>TL_SEARCH_FIELDS.some(k=>(e[k]||'').toString().toLowerCase().includes(q)));}
  if(_tlStart){const sd=new Date(_tlStart);rows=rows.filter(e=>{const d=pTS(e.time);return d&&d>=sd;});}
  if(_tlEnd){const ed=new Date(_tlEnd);rows=rows.filter(e=>{const d=pTS(e.time);return d&&d<=ed;});}
  return rows;
}

function renderTimelineTab(){
  const sub=document.getElementById('sub-dt');
  if(!sub)return;
  if(!_TL.length){sub.innerHTML='<div class="empty" style="padding:24px">No timeline yet. Collects every 30 min after startup.</div>';return;}
  if(!_tlColW)_tlColW=Object.fromEntries(TL_COLS.map(c=>[c.key,c.w]));
  const rows=tlFiltered();
  const types=[...new Set(_TL.map(e=>e.event_type||e.source||'event'))].sort();
  const active=_tlF||_tlType||_tlStart||_tlEnd;
  const tRow=e=>{
    const et=e.event_type||e.source||'event';const ic=TL_ICON[et]||'&#x25CF;';const co=TL_COLOR[et]||'var(--muted)';
    const desc=e.threat_name||e.process_name||e.user||'(event)';
    const detail=e.command_line||e.path||e.remote_address||e.parent_name||'';
    const user=e.user||'-';
    return `<tr class="cr-row" onclick='oTE(${JSON.stringify(JSON.stringify(e))})'>
<td style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)">${fmtTS(e.time)}</td>
<td style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px"><span style="color:${co}">${ic}</span> ${esc(et)}</td>
<td style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(desc)}">${esc(desc)}</td>
<td style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.pid??'-'}</td>
<td style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(user)}">${esc(user)}</td>
<td style="font-size:11px;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(detail)}">${esc(detail)}</td>

function initTlResize(){
  const sub=document.getElementById('sub-dt');
  sub.querySelectorAll('.col-rz').forEach(handle=>{
    handle.addEventListener('mousedown',ev=>{
      ev.preventDefault();ev.stopPropagation();
      const key=handle.dataset.col;
      const th=handle.closest('th');
      const startX=ev.clientX;const startW=th.offsetWidth;
      handle.classList.add('active');
      const onMove=mv=>{
        const w=Math.max(50,startW+(mv.clientX-startX));
        _tlColW[key]=w;
        const idx=TL_COLS.findIndex(c=>c.key===key);
        const col=sub.querySelectorAll('col')[idx];
        if(col)col.style.width=w+'px';
      };
      const onUp=()=>{
        handle.classList.remove('active');
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
      };
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
  });
}

function exportTimelineCsv(){

  const lines=[TL_CSV_COLS.join(','),...rows.map(e=>TL_CSV_COLS.map(c=>csvEsc(e[c])).join(','))];

async function saveRule(){
  const name=document.getElementById('rn')?.value?.trim();if(!name){alert('Name required');return;}
  const csv=s=>s.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
  const conds={};
  const pp=csv(document.getElementById('rpp')?.value||'');if(pp.length)conds.parent_process=pp;
  const pn=csv(document.getElementById('rpn')?.value||'');if(pn.length)conds.process_name=pn;
  const cl=csv(document.getElementById('rcl')?.value||'');if(cl.length)conds.command_line_contains=cl;
  const ip=csv(document.getElementById('rip')?.value||'');if(ip.length)conds.ip_address_matches=ip;
  const hh=document.getElementById('rhash')?.value.split(',').map(s=>s.trim()).filter(s=>s.length===64)||[];if(hh.length)conds.file_hash_matches=hh;
  const dom=csv(document.getElementById('rdom')?.value||'');if(dom.length)conds.domain_contains=dom;
  const actions=ACTS.filter(a=>document.getElementById('ra-'+a.id)?.checked).map(a=>a.id);
  if(!actions.length)actions.push('alert_only');
  const payload={name,description:document.getElementById('rd')?.value?.trim()||'',severity:document.getElementById('rsev')?.value||'MEDIUM',mitre_tactic:document.getElementById('rmt')?.value?.trim()||'',enabled:document.getElementById('ren')?.value!=='false',conditions:conds,actions};
  const isN=!_editR;const url=isN?'/api/rules?scope=global':`/api/rules/${_editR.id}?scope=global`;
  const r=await api(url,{method:isN?'POST':'PUT',body:JSON.stringify(payload)});
  if(r.ok){cM('rm');renderRules(document.getElementById('content'));}
  else{const d=await r.json().catch(()=>({detail:'Error'}));alert('Failed: '+d.detail);}
}

<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">${chk('rp-del-endpoint',p.delete_from_endpoint!==false)} Apply to endpoint (each PC)</label>
</div>
<div style="font-size:11px;color:var(--muted);margin-top:-10px;margin-bottom:14px">"Move" only applies to cloud data (Archived Reports / Closed Alerts). Endpoint logs and quarantined files don't support moving to a destination &mdash; they're always rotated/deleted locally when endpoint retention is on.</div>

<div id="rp-dest-wrap" style="display:${p.action==='move'?'flex':'none'};flex-direction:column;gap:12px;padding:14px;background:var(--surface2);border-radius:8px;margin-bottom:14px">
<div class="fl">Move Destination (any S3-compatible bucket &mdash; another Oracle bucket, AWS S3, or an on-prem MinIO/S3-compatible server)</div>
<div class="ff"><div class="fl">Endpoint URL</div><input id="rp-dest-endpoint" class="fip" value="${esc(dest.endpoint||'')}" placeholder="https://s3.example.com or on-prem MinIO URL"></div>
<div class="grid2">
<div class="ff"><div class="fl">Bucket</div><input id="rp-dest-bucket" class="fip" value="${esc(dest.bucket||'')}" placeholder="retained-security-data"></div>
<div class="ff"><div class="fl">Region</div><input id="rp-dest-region" class="fip" value="${esc(dest.region||'us-ashburn-1')}"></div>
</div>
<div class="grid2">
<div class="ff"><div class="fl">Access Key</div><input id="rp-dest-key" class="fip" value="${esc(dest.access_key||'')}"></div>
<div class="ff"><div class="fl">Secret Key</div><input id="rp-dest-secret" class="fip" type="password" placeholder="${dest.has_secret?'Unchanged (leave blank to keep)':'Enter secret key'}"></div>
</div>
<div class="ff"><div class="fl">Key Prefix (optional)</div><input id="rp-dest-prefix" class="fip" value="${esc(dest.prefix||'retained/')}"></div>
</div>

${numRow('rp-interval','Auto-sweep interval (hours)',p.sweep_interval_hours||24,'How often the dashboard opportunistically re-checks the cloud side. Actual cadence depends on dashboard traffic since there\'s no dedicated background worker.')}

${isAdmin?`<div class="btn-row" style="margin-top:14px">
<button class="btn btn-p" onclick="saveRetention()">Save Retention Policy</button>
<button class="btn btn-d" onclick="runRetentionNow(this)">Run Cloud Sweep Now</button>
</div>`:'<p style="font-size:12px;color:var(--muted);margin-top:10px">Requires Admin role.</p>'}
${p.updated_at?`<div style="font-size:11px;color:var(--muted);margin-top:8px">Last saved ${fmtAge(p.updated_at)} by ${esc(p.updated_by||'-')}</div>`:''}
${lr?`<div style="font-size:11px;color:var(--muted);margin-top:8px">Last cloud sweep: ${fmtAge(lr.ran_at)} (${esc(lr.trigger||'-')}, ${esc(lr.status||'-')})${lrSummary?`<div style="margin-top:4px">${lrSummary}</div>`:''}</div>`:'<div style="font-size:11px;color:var(--muted);margin-top:8px">No cloud sweep has run yet.</div>'}
</div>
</div>`;
}

function tglRpDest(){
  const show=document.getElementById('rp-action')?.value==='move';
  const el=document.getElementById('rp-dest-wrap');
  if(el)el.style.display=show?'flex':'none';
}

async function saveSets(){
  const body={org_name:document.getElementById('so')?.value?.trim(),offline_threshold_hours:parseInt(document.getElementById('soh')?.value)||1,offline_days_warning:parseInt(document.getElementById('sow')?.value)||7,mttd_target_minutes:parseInt(document.getElementById('sm')?.value)||30,mttr_target_minutes:parseInt(document.getElementById('smt')?.value)||120};
  const r=await api('/api/settings',{method:'PUT',body:JSON.stringify(body)});
  if(r.ok){document.getElementById('org-name').textContent=body.org_name||'SME Security';alert('Saved!');}
  else{const d=await r.json().catch(()=>({detail:'Error'}));alert('Failed: '+d.detail);}
}

async function saveAgentSchedule(){
  const gv=id=>document.getElementById(id)?.value;
  const gc=id=>!!document.getElementById(id)?.checked;
  const body={
    usb_lockdown_enabled:gc('ag-usb'),
    process_monitor_enabled:gc('ag-proc'),
    defender_dns_enabled:gc('ag-defdns'),defender_dns_interval_hours:parseInt(gv('ag-defdns-h'))||24,
    threat_enabled:gc('ag-threat'),threat_interval_minutes:parseInt(gv('ag-threat-m'))||5,
    timeline_enabled:gc('ag-timeline'),timeline_interval_minutes:parseInt(gv('ag-timeline-m'))||30,timeline_lookback_hours:parseInt(gv('ag-timeline-h'))||24,
    reporter_interval_minutes:parseInt(gv('ag-rep-m'))||15,
    command_executor_enabled:gc('ag-cmd'),command_executor_interval_minutes:parseInt(gv('ag-cmd-m'))||5,
  };
  const r=await api('/api/agent-schedule',{method:'PUT',body:JSON.stringify(body)});
  if(r.ok){alert('Agent schedule saved! Endpoint agents will pick this up within one Command Executor cycle.');renderSettings(document.getElementById('content'));}
  else{const d=await r.json().catch(()=>({detail:'Error'}));alert('Failed: '+d.detail);}
}

async function saveRetention(){
  const gv=id=>document.getElementById(id)?.value;
  const gc=id=>!!document.getElementById(id)?.checked;
  const body={
    enabled:gc('rp-enabled'),
    age_days:gv('rp-age')?parseInt(gv('rp-age')):null,
    max_size_gb:gv('rp-size')?parseFloat(gv('rp-size')):null,
    targets:{cloud_reports:gc('rp-t-reports'),cloud_alerts:gc('rp-t-alerts'),endpoint_logs:gc('rp-t-logs'),endpoint_quarantine:gc('rp-t-quarantine')},
    action:gv('rp-action'),
    delete_from_cloud:gc('rp-del-cloud'),
    delete_from_endpoint:gc('rp-del-endpoint'),
    sweep_interval_hours:parseInt(gv('rp-interval'))||24,
    move_destination:{
      endpoint:(gv('rp-dest-endpoint')||'').trim(),
      access_key:(gv('rp-dest-key')||'').trim(),
      secret_key:gv('rp-dest-secret')||'',
      bucket:(gv('rp-dest-bucket')||'').trim(),
      region:(gv('rp-dest-region')||'').trim()||'us-ashburn-1',
      prefix:(gv('rp-dest-prefix')||'').trim()||'retained/',
    },
  };
  const r=await api('/api/retention-policy',{method:'PUT',body:JSON.stringify(body)});
  if(r.ok){alert('Retention policy saved.');renderSettings(document.getElementById('content'));}
  else{const d=await r.json().catch(()=>({detail:'Error'}));alert('Failed: '+d.detail);}
}

async function runRetentionNow(btn){
  if(!confirm('Run the cloud-side retention sweep now? Depending on the saved policy this may permanently delete or move data. Continue?'))return;
  btn.disabled=true;const orig=btn.textContent;btn.textContent='Running...';
  try{
    const r=await api('/api/retention-policy/run-now',{method:'POST'});
    const d=await r.json().catch(()=>({}));
    if(r.ok){alert('Sweep complete.');renderSettings(document.getElementById('content'));}
    else{alert('Failed: '+(d.detail||d.reason||r.status));btn.disabled=false;btn.textContent=orig;}
  }catch(ex){alert('Failed: '+ex);btn.disabled=false;btn.textContent=orig;}
}

function cM(id){document.getElementById(id).style.display='none';}
function cmo(e,id){if(e.target===document.getElementById(id))cM(id);}

</script>
</body>
</html>
